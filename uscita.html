<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uscita — Chroma Key</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #00b140; /* stesso verde della consolle, per il chroma key */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #contenitore-live {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 94%;
      gap: 0.15em;

      /* spazio sempre riservato per 2 righe: il ritaglio in OBS resta identico
         anche quando il testo è vuoto o su una sola riga */
      min-height: calc(1.3em * 2);
    }

    .riga-live {
      white-space: nowrap;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 2rem;
      line-height: 1.3;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="contenitore-live"></div>

  <script>
    (() => {
      const contenitore = document.getElementById('contenitore-live');
      const CHIAVE_STATO_USCITA = 'consolletx_stato_uscita_v1';

      let ultimoTimestamp = 0;
      let ultimoStato = null;

      // Riduce la dimensione del font di UNA riga finché non ci sta, tutta intera,
      // nella larghezza disponibile — non va mai a capo da sola e non esce dal
      // bordo, qualunque sia la risoluzione/larghezza di questo schermo.
      function adattaRigaALarghezza(elemento, larghezzaDisponibile, dimensioneMassima) {
        const dimensioneMinima = 10;
        elemento.style.fontSize = dimensioneMassima + 'px';
        if (elemento.scrollWidth <= larghezzaDisponibile) return;

        let min = dimensioneMinima, max = dimensioneMassima, migliore = dimensioneMinima;
        for (let i = 0; i < 10 && min <= max; i++) {
          const meta = Math.floor((min + max) / 2);
          elemento.style.fontSize = meta + 'px';
          if (elemento.scrollWidth <= larghezzaDisponibile) { migliore = meta; min = meta + 1; }
          else { max = meta - 1; }
        }
        elemento.style.fontSize = migliore + 'px';
      }

      function renderRighe(stato) {
        contenitore.innerHTML = "";
        const righe = (stato.righe || []).filter(r => r && r.trim().length > 0);
        if (righe.length === 0) return;

        const dimensioneMassima = stato.fontSizeMax || 28;
        const larghezzaDisponibile = contenitore.clientWidth;

        righe.forEach(testoRiga => {
          const riga = document.createElement('div');
          riga.className = 'riga-live';
          if (stato.fontFamily) riga.style.fontFamily = stato.fontFamily;
          if (stato.color)      riga.style.color      = stato.color;
          if (stato.fontWeight) riga.style.fontWeight = stato.fontWeight;
          if (stato.lineHeight) riga.style.lineHeight = stato.lineHeight;
          riga.textContent = testoRiga;
          contenitore.appendChild(riga);
          adattaRigaALarghezza(riga, larghezzaDisponibile, dimensioneMassima);
        });
      }

      function applicaStato(stato) {
        if (!stato) return;
        if (stato.timestamp && stato.timestamp <= ultimoTimestamp) return;
        if (stato.timestamp) ultimoTimestamp = stato.timestamp;
        ultimoStato = stato;
        renderRighe(stato);
      }

      function leggiStatoSalvato() {
        try {
          const raw = localStorage.getItem(CHIAVE_STATO_USCITA);
          if (raw) applicaStato(JSON.parse(raw));
        } catch (e) {}
      }

      leggiStatoSalvato();

      let canale = null;
      try {
        canale = new BroadcastChannel('consolletx-uscita');
        canale.onmessage = (ev) => {
          if (ev.data && ev.data.tipo === 'stato') applicaStato(ev.data.stato);
        };
      } catch (e) { canale = null; }

      window.addEventListener('message', (ev) => {
        if (ev.data && ev.data.tipo === 'stato') applicaStato(ev.data.stato);
      });

      window.addEventListener('storage', (ev) => {
        if (ev.key === CHIAVE_STATO_USCITA && ev.newValue) {
          try { applicaStato(JSON.parse(ev.newValue)); } catch (e) {}
        }
      });

      // polling di sicurezza: garantisce l'aggiornamento anche se gli eventi sopra non arrivano
      setInterval(leggiStatoSalvato, 400);

      // ridisegna al ridimensionamento di QUESTA finestra: ogni riga si adatta
      // sempre alla larghezza reale disponibile, qualunque sia lo schermo
      let timerResize = null;
      window.addEventListener('resize', () => {
        clearTimeout(timerResize);
        timerResize = setTimeout(() => { if (ultimoStato) renderRighe(ultimoStato); }, 150);
      });

      function segnalaPresenza() {
        if (canale) { try { canale.postMessage({ tipo: 'ping' }); } catch (e) {} }
        if (window.opener) { try { window.opener.postMessage({ tipo: 'ping' }, '*'); } catch (e) {} }
      }
      segnalaPresenza();
      setInterval(segnalaPresenza, 2000);
    })();
  </script>

</body>
</html>
